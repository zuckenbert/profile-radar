<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile Radar · Settings</title>
<link rel="stylesheet" href="../popup/ui.css">
<style>
  body { font-size: 15px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px 64px; }
  .top { padding: 20px 24px 24px; }
  .top .in { max-width: 640px; margin: 0 auto; padding: 0 24px; }
  .top .brand img { width: 22px; height: 22px; }
  .top .brand .wordmark { font-size: 15px; }
  .top h1 { font-size: 28px; }
  .top .sub { font-size: 14px; }
  section { padding: 28px 0; border-bottom: 1px solid var(--rule); }
  section > .eyebrow { color: var(--muted); display: block; margin-bottom: 14px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
  input[type=text], input[type=url], input[type=password], input[type=number] { width: 100%; font-family: var(--mono); font-size: 13px; padding: 9px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--ink); }
  input:focus { border-color: var(--accent); outline: none; }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .check { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; margin: 0; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 24px; }
  #msg { font-weight: 500; font-size: 13px; color: var(--muted); }
  ul { margin: 0; padding-left: 18px; }
  li { margin-bottom: 6px; }
  li.risk { color: var(--muted); }
</style>
</head>
<body>
  <header class="top"><div class="in">
    <div class="bar">
      <span class="brand"><img src="../img/icon32.png" alt=""><span class="wordmark" data-i18n="extName">Profile Radar</span></span>
      <span class="eyebrow" data-i18n="popupEyebrow">LinkedIn · daily</span>
    </div>
    <h1 data-i18n="optionsHeading">Settings</h1>
    <div class="sub" data-i18n="optionsSub">The extension only reads your own list of profile viewers. It never clicks, sends messages or visits profiles.</div>
  </div></header>
  <div class="wrap">
    <section>
      <span class="eyebrow" data-i18n="secReading">Reading</span>
      <label class="check"><input type="checkbox" id="enabled"> <span data-i18n="optEnabled">Read once a day, automatically</span></label>
      <label for="owner" data-i18n="optOwner">Whose profile is this</label>
      <input type="text" id="owner" data-i18n-placeholder="optOwnerPlaceholder" placeholder="Name shown in the popup (optional)">
      <div class="pair">
        <div><label for="hourFrom" data-i18n="optHourFrom">From (hour)</label><input type="number" id="hourFrom" min="0" max="23"></div>
        <div><label for="hourTo" data-i18n="optHourTo">Until (hour)</label><input type="number" id="hourTo" min="1" max="24"></div>
      </div>
      <p class="hint" data-i18n="optWindowHint"></p>
    </section>
    <section>
      <span class="eyebrow" data-i18n="secDestination">Endpoint (optional)</span>
      <label for="endpoint" data-i18n="optEndpoint">HTTPS endpoint that receives new viewers</label>
      <input type="url" id="endpoint" placeholder="https://">
      <label for="token" data-i18n="optToken">Bearer token (optional)</label>
      <input type="password" id="token" data-i18n-placeholder="optTokenPlaceholder" autocomplete="off">
      <p class="hint" data-i18n="optDestHint"></p>
    </section>
    <section>
      <span class="eyebrow" data-i18n="secAbout">What it does and what it does not do</span>
      <ul>
        <li data-i18n="about1"></li>
        <li data-i18n="about2"></li>
        <li data-i18n="about3"></li>
        <li data-i18n="about4"></li>
        <li class="risk" data-i18n="about5"></li>
      </ul>
    </section>
    <div class="actions">
      <button class="btn" id="save" data-i18n="btnSave">Save</button>
      <button class="btn ghost" id="flush" data-i18n="btnFlush">Send pending now</button>
      <span id="msg" role="status"></span>
    </div>
  </div>
  <script src="../lib/messages-en.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
